<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeed AI — O'zbekcha Sun'iy Intellekt</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Top Header */
        header {
            background-color: #161b22;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #30363d;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            color: #58a6ff;
        }

        .logo span {
            color: #f0f6fc;
        }

        /* Chat Main Area */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .message {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.5;
        }

        .user-message {
            align-self: flex-end;
            background-color: #1f6feb;
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .ai-message {
            align-self: flex-start;
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-bottom-left-radius: 2px;
        }

        /* Input Area */
        .input-container {
            padding: 15px 20px;
            background-color: #161b22;
            border-top: 1px solid #30363d;
        }

        .input-box-wrapper {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-box {
            display: flex;
            gap: 10px;
            background-color: #0d1117;
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid #30363d;
        }

        .input-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #f0f6fc;
            font-size: 15px;
            padding: 8px;
        }

        .input-box button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .input-box button:hover {
            background-color: #2ea043;
        }

        /* Warning text */
        .disclaimer {
            text-align: center;
            font-size: 12px;
            color: #8b949e;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Zeed <span>AI</span></div>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message ai-message">
            Salom! Men <b>Zeed AI</b>man. Sizga qanday yordam bera olaman?
        </div>
    </div>

    <div class="input-container">
        <div class="input-box-wrapper">
            <div class="input-box">
                <input type="text" id="userInput" placeholder="Zeed AI'ga xabar yuboring..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Yuborish</button>
            </div>
            <p class="disclaimer">Zeed AI xato qilishi mumkin. Muhim ma'lumotlarni tekshiring.</p>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (text === '') return;

            const chatContainer = document.getElementById('chatContainer');

            // User Message
            const userMsg = document.createElement('div');
            userMsg.className = 'message user-message';
            userMsg.textContent = text;
            chatContainer.appendChild(userMsg);

            input.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // AI Thinking Message
            const aiMsg = document.createElement('div');
            aiMsg.className = 'message ai-message';
            aiMsg.innerHTML = '<i>Zeed AI o\'ylamoqda...</i>';
            chatContainer.appendChild(aiMsg);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Smart Local Response
            setTimeout(() => {
                let reply = "Savolingiz uchun rahmat! Men sizga yordam berishga tayyorman.";
                const lower = text.toLowerCase();

                if (lower.includes('salom') || lower.includes('assalom')) {
                    reply = "Assalomu alaykum! Xush kelibsiz. Qanday savolingiz bor?";
                } else if (lower.includes('kim') || lower.includes('isming')) {
                    reply = "Men Zeed AI man — sizning shaxsiy sun'iy intellekt yordamchingizman!";
                } else if (lower.includes('youtube') || lower.includes('kanal')) {
                    reply = "YouTube kanal ochish g'oyasi juda zo'r! O'yinlar va IT loyihalar haqida videolar olsak, tezda rivojlanamiz.";
                } else if (lower.includes('o\'yin') || lower.includes('game') || lower.includes('pubg')) {
                    reply = "O'yinlar haqida gaplashamizmi? PUBG Mobile yoki FC Mobile bo'yicha g'oyalaringiz bormi?";
                }

                aiMsg.innerHTML = reply;
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 500);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
