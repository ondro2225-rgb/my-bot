<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeed AI - Gemini 4 Argon</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-panel { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .message-animation { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 3px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="glass-panel border-b border-slate-800 px-6 py-4 flex items-center justify-between z-10">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-wide bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent">Zeed AI</h1>
                <p class="text-xs text-slate-400">Gemini 4 Argon • Intelligent Companion</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                <span class="w-1.5 h-1.5 mr-1.5 bg-emerald-400 rounded-full animate-pulse"></span> Online
            </span>
        </div>
    </header>

    <!-- Chat Container -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 max-w-4xl w-full mx-auto">
        <!-- Welcome Message -->
        <div class="flex items-start space-x-4 message-animation">
            <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center shrink-0 shadow-md">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
            </div>
            <div class="glass-panel p-4 rounded-2xl rounded-tl-none max-w-[85%] md:max-w-[75%] text-slate-200 shadow-xl leading-relaxed">
                Salom! Men Zeed AIman. Siz bilan har qanday mavzuda dildan suhbatlashishga, savollaringizga aniq va to'liq javob berishga tayyorman. Bugun qanday yordam bera olaman?
            </div>
        </div>
    </main>

    <!-- Input Footer -->
    <footer class="p-4 bg-slate-900/80 backdrop-blur-md border-t border-slate-800">
        <form id="chat-form" class="max-w-4xl mx-auto flex items-center space-x-3">
            <div class="relative flex-1">
                <input type="text" id="user-input" placeholder="Xabaringizni yozing..." autocomplete="off"
                    class="w-full bg-slate-950/80 border border-slate-800 rounded-2xl px-5 py-4 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all shadow-inner text-sm md:text-base">
            </div>
            <button type="submit" id="send-button"
                class="bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white px-6 py-4 rounded-2xl font-medium transition-all shadow-lg shadow-indigo-600/30 flex items-center justify-center shrink-0">
                <svg class="w-5 h-5 transform rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
            </button>
        </form>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        const apiKey = "nai_Rz7XBPjZm8k1tydHDNwMkEmI64wIGBVIlpWl78XEQR0yZzCK";
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');

        let messageHistory = [
            { role: "system", content: "Siz Zeed AI — ilg'or, samimiy va do'stona sun'iy intellekt yordamchisiz. Foydalanuvchiga har doim yordam berishga tayyor bo'lib, o'zbek tilida tabiiy va mufassal javob berasiz." }
        ];

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            // Append User Message
            appendMessage(text, 'user');
            messageHistory.push({ role: "user", content: text });
            userInput.value = '';
            userInput.disabled = true;
            sendButton.disabled = true;

            // Create Loading Bubble
            const loadingId = appendLoading();

            try {
                const response = await fetch('https://my.neuronal.uz/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "gpt-4o-mini", // yoki platformadagi mavjud model
                        messages: messageHistory,
                        stream: false
                    })
                });

                const data = await response.json();
                removeLoading(loadingId);

                if (data.choices && data.choices.length > 0) {
                    const aiReply = data.choices[0].message.content;
                    appendMessage(aiReply, 'ai');
                    messageHistory.push({ role: "assistant", content: aiReply });
                } else {
                    appendMessage("Kechirasiz, javob olishda xatolik yuz berdi.", 'ai');
                }
            } catch (error) {
                removeLoading(loadingId);
                appendMessage("Tarmoq bilan bog'lanishda xatolik yuz berdi. Qaytadan urinib ko'ring.", 'ai');
            } finally {
                userInput.disabled = false;
                sendButton.disabled = false;
                userInput.focus();
            }
        });

        function appendMessage(text, sender) {
            const isUser = sender === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `flex items-start space-x-4 message-animation ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;
            
            const avatar = document.createElement('div');
            avatar.className = `w-9 h-9 rounded-xl flex items-center justify-center shrink-0 shadow-md ${isUser ? 'bg-gradient-to-tr from-pink-500 to-purple-600' : 'bg-indigo-600'}`;
            avatar.innerHTML = isUser ? 
                '<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>' :
                '<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>';

            const bubble = document.createElement('div');
            bubble.className = `glass-panel p-4 rounded-2xl max-w-[85%] md:max-w-[75%] text-slate-200 shadow-xl leading-relaxed ${isUser ? 'rounded-tr-none bg-indigo-600/20 border-indigo-500/30' : 'rounded-tl-none'}`;
            
            if (isUser) {
                bubble.textContent = text;
            } else {
                bubble.innerHTML = marked.parse(text);
            }

            wrapper.appendChild(avatar);
            wrapper.appendChild(bubble);
            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendLoading() {
            const id = 'loading-' + Date.now();
            const wrapper = document.createElement('div');
            wrapper.id = id;
            wrapper.className = `flex items-start space-x-4 message-animation`;
            
            const avatar = document.createElement('div');
            avatar.className = `w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center shrink-0 shadow-md`;
            avatar.innerHTML = '<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>';

            const bubble = document.createElement('div');
            bubble.className = `glass-panel p-4 rounded-2xl rounded-tl-none text-slate-400 shadow-xl flex items-center space-x-2`;
            bubble.innerHTML = `
                <div class="w-2 h-2 bg-indigo-400 rounded-full animate-bounce"></div>
                <div class="w-2 h-2 bg-purple-400 rounded-full animate-bounce [animation-delay:0.2s]"></div>
                <div class="w-2 h-2 bg-pink-400 rounded-full animate-bounce [animation-delay:0.4s]"></div>
            `;

            wrapper.appendChild(avatar);
            wrapper.appendChild(bubble);
            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        function removeLoading(id) {
            const element = document.getElementById(id);
            if (element) element.remove();
        }
    </script>
</body>
</html>
