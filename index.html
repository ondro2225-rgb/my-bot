<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeed AI - Kiberxavfsizlik va Anti-Scam Himoyasi</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 shadow-lg">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="bg-indigo-600 p-2 rounded-xl text-white font-bold text-xl shadow-md">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h1 class="text-xl font-extrabold tracking-wider bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">Zeed AI Security</h1>
            </div>
            <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1.5 rounded-full font-medium">
                <i class="fa-solid fa-circle text-[8px] animate-pulse mr-1"></i> Himoya Faol
            </span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-2xl mx-auto p-4 w-full flex-grow flex flex-col justify-center my-8">
        <div class="text-center mb-8">
            <h2 class="text-2xl md:text-3xl font-black mb-3">Shubhali Havola yoki Botni Tekshiring</h2>
            <p class="text-slate-400 text-sm md:text-base">Internetdagi noma'lum havolalar, sovg'a konkurslari va firibgar botlarni shu yerga kiriting. Zeed AI xavfsizlik bazasi orqali tekshirib beradi.</p>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
            <div class="mb-4">
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Havola (URL) yoki Bot nomi:</label>
                <div class="flex gap-2">
                    <input type="text" id="userInput" placeholder="Masalan: https://t.cloud-bonus-gift.uz yoki bot nomi..." 
                        class="flex-grow bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-indigo-500 transition text-sm">
                    <button onclick="checkSafety()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-6 py-3 rounded-xl transition shadow-lg text-sm flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-magnifying-glass mr-2"></i> Tekshirish
                    </button>
                </div>
            </div>

            <!-- Result Box -->
            <div id="resultBox" class="hidden mt-6 p-4 rounded-xl border text-sm transition-all">
                <div id="resultContent" class="flex items-start space-x-3">
                    <!-- Dinamik natija shu yerga chiqadi -->
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 text-center py-4 text-xs text-slate-500">
        <p>&copy; 2026 Zeed AI Security. Xalqimiz xavfsizligi yo'lida.</p>
    </footer>

    <!-- Script -->
    <script>
        function checkSafety() {
            const input = document.getElementById('userInput').value.trim().toLowerCase();
            const resultBox = document.getElementById('resultBox');
            const resultContent = document.getElementById('resultContent');

            if (!input) {
                alert("Iltimos, tekshirish uchun havola yoki matn kiriting!");
                return;
            }

            resultBox.classList.remove('hidden');

            // Bazaviy tahlil logikasi (firibgarlikka xos so'zlar)
            const scamKeywords = ['bonus', 'gift', 'hadiya', 'pul', 'lotereya', 'telegram-uz', 'free', 'win', 'klik', 'click-pay', 'aksiya', 'yutuq'];
            let isSuspicious = false;

            for (let word of scamKeywords) {
                if (input.includes(word)) {
                    isSuspicious = true;
                    break;
                }
            }

            if (isSuspicious || input.length < 5) {
                resultBox.className = "mt-6 p-4 rounded-xl border border-rose-500/30 bg-rose-500/10 text-rose-300 transition-all";
                resultContent.innerHTML = `
                    <i class="fa-solid fa-triangle-exclamation text-rose-500 text-xl mt-0.5"></i>
                    <div>
                        <strong class="block font-bold text-rose-400 mb-1">DIQQAT! Xavfli yoki Shubhali Havola!</strong>
                        <p class="text-xs text-rose-300/80">Bu havolada firibgarlarga xos belgilari bor. Shaxsiy ma'lumotlaringiz yoki parollaringizni kiritmang, aldashlari mumkin!</p>
                    </div>
                `;
            } else {
                resultBox.className = "mt-6 p-4 rounded-xl border border-emerald-500/30 bg-emerald-500/10 text-emerald-300 transition-all";
                resultContent.innerHTML = `
                    <i class="fa-solid fa-circle-check text-emerald-500 text-xl mt-0.5"></i>
                    <div>
                        <strong class="block font-bold text-emerald-400 mb-1">Havola Xavfsiz Ko'rinadi</strong>
                        <p class="text-xs text-emerald-300/80">Tizim tahliliga ko'ra bu havolada ochiq-oydin xavf belgisi topilmadi. Lekin har doim hushyor bo'lishingiz tavsiya qilinadi.</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
