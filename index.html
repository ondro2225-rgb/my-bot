<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeed AI - Flash Assistant</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0e1117; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        h2 { text-align: center; color: #4f46e5; margin-top: 0; }
        #chat-container { flex: 1; overflow-y: auto; border: 1px solid #374151; padding: 15px; border-radius: 8px; margin-bottom: 15px; background: #1f2937; }
        .message { margin-bottom: 12px; padding: 12px; border-radius: 8px; line-height: 1.5; max-width: 80%; }
        .user { background: #3b82f6; margin-left: auto; text-align: right; }
        .bot { background: #374151; margin-right: auto; text-align: left; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 14px; border-radius: 8px; border: 1px solid #4b5563; background: #111827; color: #fff; font-size: 16px; outline: none; }
        input:focus { border-color: #4f46e5; }
        button { padding: 14px 24px; background: #4f46e5; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; }
        button:hover { background: #4338ca; }
    </style>
</head>
<body>

    <h2>🤖 Zeed AI Workspace</h2>
    <div id="chat-container"></div>
    
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Savolingizni shu yerga yozing..." onkeypress="handleKey(event)">
        <button onclick="sendMessage()">Yuborish</button>
    </div>

    <script>
        // API kalitingiz joylandi
        const API_KEY = "AQ.Ab8RN6KyHqo8kvY2t8rFPVLeFc8uWwOX4-6EVlTyq08efuI_rw";

        async function sendMessage() {
            const inputField = document.getElementById("userInput");
            const chatContainer = document.getElementById("chat-container");
            const prompt = inputField.value.trim();
            
            if (!prompt) return;

            // Foydalanuvchi xabarini ekranga chiqarish
            chatContainer.innerHTML += `<div class="message user"><b>Siz:</b> ${prompt}</div>`;
            inputField.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Kuting xabarini chiqarish
            const loadingId = "loading_" + Date.now();
            chatContainer.innerHTML += `<div id="${loadingId}" class="message bot"><b>Zeed AI:</b> O'ylamoqda...</div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                // To'g'ridan-to'g'ri gemini-1.5-flash orqali tezkor so'rov
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content) {
                    const botReply = data.candidates[0].content.parts[0].text;
                    document.getElementById(loadingId).innerHTML = `<b>Zeed AI:</b> ${botReply}`;
                } else if (data.error) {
                    document.getElementById(loadingId).innerHTML = `<b>Xatolik:</b> ${data.error.message}`;
                } else {
                    document.getElementById(loadingId).innerHTML = `<b>Xatolik:</b> API kalitni tekshiring.`;
                }
            } catch (error) {
                document.getElementById(loadingId).innerHTML = `<b>Xatolik:</b> Tarmoqqa ulanishda xatolik yuz berdi.`;
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleKey(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }
    </script>
</body>
</html>
